manifest_version: 1.1.0
runtime_downloads_allowed: false
# This project is self-contained. It has NO runtime dependency on any other checkout.
# Pretrained weights are not vendored: each component below declares how to obtain it
# and the sha256 to verify it against. Run `python scripts/setup/fetch_models.py` to
# stage everything into models/ , then `--verify` to check hashes before a run.
#
# sha256 values are the exact bytes used by the authorized environment on 2026-08-13.
# They are verification targets, not provenance claims about an upstream release tag.
# Fields marked capture_at_run have no evidenced value yet and must never be guessed.
provenance:
  recorded_on: "2026-08-14"
  # Measured directly from the deployment after the successful offline GPU stage-1
  # smoke run. The per-run manifest records the environment again at run time and is
  # authoritative for any produced result.
  runtime:
    python: "3.10.12"
    torch: "2.5.1+cu121"
    torchvision: "0.20.1+cu121"
    torchaudio: "2.5.1+cu121"
    nvidia_cudnn_cu12: "9.1.1.17"
    triton: "3.1.0"
    onnxruntime: "1.23.2"
    opencv_python_headless: "5.0.0.93"
    transformers: "4.57.6"
    huggingface_hub: "0.36.0"
    ultralytics: "8.4.8"
    whisperx: "3.7.4"
    faster_whisper: "1.2.1"
    ctranslate2: "4.6.3"
    av: "15.1.0"
    numpy: "2.0.2"
    pandas: "2.2.3"
    pyannote_audio: "3.4.0"
    speechbrain: "1.0.3"
    easyocr: "1.7.2"
components:
  - component_id: yolov8
    role: person_detection_tracking
    version: "ultralytics 8.4.8"
    source:
      type: ultralytics_auto
      repository: https://github.com/ultralytics/ultralytics
      model: yolov8n.pt
      instruction: >-
        Ultralytics resolves and caches `yolov8n.pt` on first use. Fetch once, then move
        it to install_path and verify the hash. The exact upstream release tag backing
        these bytes is capture_at_run; the sha256 is what pins reproducibility here.
    install_path: models/yolov8n.pt
    sha256: f59b3d833e2ff32e194b5bb8e08d211dc7c5bdf144b90d2c8412c47ccfc83b36
    bytes: 6549796
    license: AGPL-3.0
    notes: >-
      scripts/person_tracking/track_persons.py:43 takes the checkpoint as a parameter,
      so this is configuration rather than a hardcoded default.
  - component_id: yolov8_seg
    role: native_cadence_person_segmentation_tracking
    version: "ultralytics 8.4.8"
    source:
      type: ultralytics_auto
      repository: https://github.com/ultralytics/ultralytics
      model: yolov8s-seg.pt
      instruction: >-
        With ultralytics 8.4.8 installed in the explicit setup environment, fetch
        `yolov8s-seg.pt` once through Ultralytics' documented checkpoint resolver,
        move the resulting bytes to install_path, and verify this recorded digest.
    install_path: models/yolov8s-seg.pt
    sha256: 0bac0770b55e5eb5b76a61bc535673288dcec36c2bc0cd25ee0d584c632f3413
    bytes: 23914764
    license: AGPL-3.0
    status: wired
    notes: >-
      Used person-class-only at native decoded cadence. BoT-SORT policy is pinned in
      scripts/person_tracking/botsort_identity_stack.yaml; its thresholds are
      unvalidated defaults pending calibration.
  - component_id: osnet_x0_25_msmt17
    role: person_appearance_reidentification
    version: "osnet_x0_25 trained on MSMT17; ONNX export revision capture_at_run"
    source:
      type: manual_onnx_export
      repository: https://github.com/KaiyangZhou/deep-person-reid
      revision: capture_at_run
      instruction: >-
        Obtain the documented Torchreid osnet_x0_25 MSMT17 checkpoint and run
        scripts/setup/export_osnet.py, which emits a fixed-shape float32 graph with input
        NCHW 1x3x256x128. A re-export will not necessarily be byte-identical to the
        recorded graph, so measure and record its digest rather than claiming it matches.
        The upstream checkpoint provenance for the evaluated export is capture_at_run and
        must not be invented.
    install_path: models/osnet_x0_25_msmt17.onnx
    sha256: 274f47794c20dd59f2ce3c05857d348588d1bd9c1ff847bd6c2ccd73d0a204f9
    bytes: 891414
    license: capture_at_run
    status: not_yet_staged
    notes: >-
      The checked execution environment currently contains a graph matching the recorded
      SHA-256. A public source-only clone does not redistribute those model bytes.
  - component_id: whisperx
    role: automatic_speech_recognition
    version: "whisperx 3.7.4 / faster-whisper 1.2.1"
    source:
