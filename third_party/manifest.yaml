    install_path: $PYANNOTE_CACHE
    sha256: capture_at_run
    license: capture_at_run
    status: staged_on_authorized_host_hash_not_captured
    notes: >-
      The authorized host contains cache repositories
      models--pyannote--speaker-diarization-3.1,
      models--pyannote--segmentation-3.0, and
      models--pyannote--wespeaker-voxceleb-resnet34-LM under
      ~/.cache/torch/pyannote. No concrete files from that host are available in this
      checkout to measure, so the digest and revisions remain capture_at_run and
      scripts/setup/fetch_models.py --verify must block until they are captured.
