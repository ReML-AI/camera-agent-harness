      artifact: wav2vec2_fairseq_base_ls960_asr_ls960.pth
      instruction: >-
        This exact torchaudio bundle checkpoint is already present on the authorized
        host. Set TORCH_HOME explicitly, keep the file under
        $TORCH_HOME/hub/checkpoints, and pass both the bundle name and concrete file to
        the adapter. Runtime loading is offline and may not select a default bundle.
    install_path: $TORCH_HOME/hub/checkpoints/wav2vec2_fairseq_base_ls960_asr_ls960.pth
    sha256: 488fd4f16de84438ffc945334278c1b9fb9b7159a806c1080b16111a958c945d
    bytes: 377664473
    license: capture_at_run
    status: staged_hash_measured
    notes: >-
      SHA-256 and byte count were measured directly from
      ~/.cache/torch/hub/checkpoints/wav2vec2_fairseq_base_ls960_asr_ls960.pth
      on 2026-08-14. WhisperX records resolved_type=torchaudio in its output.
  - component_id: pyannote_speaker_diarization_3_1
