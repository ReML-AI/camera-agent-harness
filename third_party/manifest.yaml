    install_path: models/faster-whisper-large-v2
    sha256: not_applicable_multi_file_snapshot
    license: "BSD-4-Clause (whisperX), MIT (faster-whisper)"
    notes: Pinned by snapshot revision rather than a single-file hash.
  - component_id: whisperx_alignment_en
    role: english_forced_alignment
    version: "torchaudio 2.5.1 / WAV2VEC2_ASR_BASE_960H"
